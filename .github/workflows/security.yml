name: Security Checks

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: "0 14 * * 1"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Dependency and Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check dashboard.js
          node --check exploit.js
          node --check tests/migration-chain.test.js
          node --check tests/audit-logging.test.js
          node --check tests/authorization.test.js

      - name: Run deterministic security tests
        run: >
          npm run test:security --
          tests/migration-chain.test.js
          tests/audit-logging.test.js